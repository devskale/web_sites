<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wetter Vorschau — Präzise Vorhersage & Sonnenenergie</title>
  <meta name="description"
    content="Erhalten Sie präzise Wettervorhersagen und berechnen Sie das Solarenergiepotenzial für Ihr Dach.">

  <!-- Preload fonts for better performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <h1 id="cityName">Wetter Vorschau</h1>
      <div class="search-container">
        <input type="text" id="cityInput" placeholder="Suchen Sie nach einer Stadt..." aria-label="Stadt suchen" />
        <button id="searchButton">
          <span class="btn-text">Suchen</span>
        </button>
      </div>
      <div class="presets">
        <button class="preset-btn" data-city="Neusiedl am See" data-lat="47.949" data-lon="16.8417">Neusiedl</button>
        <button class="preset-btn" data-city="Wien" data-lat="48.2082" data-lon="16.3738">Wien</button>
      </div>
      <div class="forecast-options">
        <label>Zeitraum:</label>
        <div class="duration-selector">
          <button class="duration-btn" data-days="2">2T</button>
          <button class="duration-btn active" data-days="4">4T</button>
          <button class="duration-btn" data-days="7">7T</button>
          <button class="duration-btn" data-days="10">10T</button>
        </div>
      </div>
    </header>

    <main>
      <section class="chart-section" aria-labelledby="temp-heading">
        <div class="section-header">
          <div>
            <h2 id="temp-heading">Temperatur & Niederschlag</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Stündliche Vorhersage für die
              nächsten 4 Tage</p>
          </div>
          <span class="badge">Live Daten</span>
        </div>
        <div id="tempChart"></div>
      </section>

      <section class="chart-section" aria-labelledby="solar-heading">
        <div class="section-header">
          <div style="flex: 1;">
            <h2 id="solar-heading">Sonnenenergie</h2>
            <p id="solar-summary" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
          </div>
          <div class="controls-wrapper">
            <div class="controls">
              <div class="input-group">
                <input type="number" id="roofArea" value="57" min="1" step="1" class="small-input" title="m²">
                <span class="unit">m²</span>
              </div>
              <div class="input-group">
                <input type="number" id="efficiency" value="17.5" min="1" max="100" step="0.5" class="small-input"
                  title="Effizienz %">
                <span class="unit">%</span>
              </div>
              <div class="input-group">
                <span id="kwpDisplay" class="value-display">10.0 kWp</span>
              </div>
            </div>
          </div>
        </div>
        <div id="solarChart"></div>
      </section>
    </main>

    <footer style="text-align: center; margin-top: 60px; color: var(--text-muted); font-size: 0.85rem;">
      <p>Daten bereitgestellt von <a href="https://open-meteo.com/" target="_blank"
          style="color: var(--accent); text-decoration: none; font-weight: 500;">Open-Meteo</a></p>
    </footer>
  </div>

  <script src="temperature_chart.js"></script>
  <script src="solar_chart.js"></script>
  <script src="app.js"></script>
</body>

</html>
