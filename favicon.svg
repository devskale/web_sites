<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sun" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="55%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- 8 rays -->
  <g fill="#FDB813">
    <rect x="30"   y="2"  width="4" height="10" rx="2"/>
    <rect x="30"   y="52" width="4" height="10" rx="2"/>
    <rect x="2"    y="30" width="10" height="4" rx="2"/>
    <rect x="52"   y="30" width="10" height="4" rx="2"/>
    <rect x="9.5"  y="9.5"  width="4" height="10" rx="2" transform="rotate(-45 11.5 14.5)"/>
    <rect x="50.5" y="9.5"  width="4" height="10" rx="2" transform="rotate(45 52.5 14.5)"/>
    <rect x="9.5"  y="44.5" width="4" height="10" rx="2" transform="rotate(45 11.5 49.5)"/>
    <rect x="50.5" y="44.5" width="4" height="10" rx="2" transform="rotate(-45 52.5 49.5)"/>
  </g>

  <!-- sun disc -->
  <circle cx="32" cy="32" r="16" fill="url(#sun)" stroke="#F59E0B" stroke-width="1.5"/>
</svg>
