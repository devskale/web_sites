<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Der Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <button id="sidebarToggle" class="d-md-none">
          <i class="fas fa-bars"></i>
        </button>
        <!-- Sidebar -->
        <div id="sidebar" class="col-md-3 d-md-block sidebar">
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h2>DerChat</h2>
          </div>

          <div class="sidebar-content">
            <div class="mb-2">
              <label for="contextField" class="form-label small"
                >Context:</label
              >
              <textarea
                id="contextField"
                class="form-control form-control-sm"
                rows="2"
                placeholder="Enter context here..."></textarea>
            </div>
            <div class="mb-2">
              <label for="jsonField" class="form-label small"
                >JSON Format:</label
              >
              <textarea
                id="jsonField"
                class="form-control form-control-sm"
                rows="2"
                placeholder="Enter JSON format here..."></textarea>
            </div>
            <div class="mb-3"><strong>Settings</strong></div>
            <div class="mb-3">
              <label for="serverField" class="form-label">Server:</label>
              <select
                id="serverField"
                name="serverField"
                class="form-select"
                required>
                <option value="">--Loading servers--</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="modelField" class="form-label">Model:</label>
              <select
                id="modelField"
                name="modelField"
                class="form-select"
                required>
                <option value="">--Please choose a server first--</option>
              </select>
            </div>
          </div>
          <div class="textarea"></div>
          <footer>
            <p>
              Design by <a href="https://skale.dev" target="_blank">skale</a>
            </p>
          </footer>
        </div>
        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-9 px-md-4">
          <form id="chatForm" class="mb-3">
            <div class="mb-3">
              <label for="inputField" class="form-label"
                >Enter your query:</label
              >
              <textarea
                id="inputField"
                name="inputField"
                class="form-control"
                required></textarea>
            </div>
            <div class="d-flex align-items-center">
              <button type="submit" class="btn btn-primary me-2">Submit</button>
              <div class="form-check me-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="contextCheck" />
                <label class="form-check-label" for="contextCheck"
                  >Context</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="jsonCheck" />
                <label class="form-check-label" for="jsonCheck">JSON</label>
              </div>
              <button
                type="button"
                id="stopButton"
                class="btn btn-secondary ms-2"
                style="display: none">
                Stop
              </button>
            </div>
          </form>
          <div id="response" class="border rounded p-3"></div>
          <div id="loading" class="lds-facebook" style="display: none">
            <div></div>
            <div></div>
            <div></div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
