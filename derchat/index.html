<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Der Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <button id="sidebarToggle" class="d-md-none">
          <i class="fas fa-bars"></i>
        </button>
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <h2>DerChat</h2>
          </div>

          <div class="sidebar-content">
            <div class="section-title">Context</div>
            <div class="mb-3">
              <label for="contextField" class="form-label"
                >Background Info / URL</label
              >
              <textarea
                id="contextField"
                class="form-control"
                rows="2"
                placeholder="Paste text or URL..."></textarea>
            </div>

            <div class="section-title">Output Schema</div>
            <div class="mb-4">
              <label for="jsonField" class="form-label">JSON Structure</label>
              <textarea
                id="jsonField"
                class="form-control"
                rows="2"
                placeholder='e.g. {"name": "string"}'></textarea>
            </div>

            <div class="section-title">Settings</div>
            <div class="mb-3">
              <label for="serverField" class="form-label"
                >Inference Server</label
              >
              <select
                id="serverField"
                name="serverField"
                class="form-select"
                required>
                <option value="">--Loading servers--</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="modelField" class="form-label">Active Model</label>
              <select
                id="modelField"
                name="modelField"
                class="form-select"
                required>
                <option value="">--Please choose a server first--</option>
              </select>
            </div>
          </div>

          <footer>
            <p>
              Design by <a href="https://skale.dev" target="_blank">skale</a>
            </p>
          </footer>
        </div>

        <!-- Main content -->
        <main>
          <div id="response"></div>

          <div id="chatFormContainer">
            <form id="chatForm">
              <div class="mb-2">
                <textarea
                  id="inputField"
                  name="inputField"
                  class="form-control"
                  placeholder="Message DerChat..."
                  required></textarea>
              </div>
              <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex gap-2">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="contextCheck" />
                    <label class="form-check-label" for="contextCheck"
                      >Context</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="jsonCheck" />
                    <label class="form-check-label" for="jsonCheck">JSON</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="toolsCheck" checked />
                    <label class="form-check-label" for="toolsCheck">Tools</label>
                  </div>
                </div>

                <div class="d-flex align-items-center">
                  <div
                    id="loading"
                    class="lds-facebook me-3"
                    style="display: none">
                    <div></div>
                    <div></div>
                    <div></div>
                  </div>
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane me-2"></i>Send
                  </button>
                  <button
                    type="button"
                    id="stopButton"
                    class="btn btn-secondary ms-2"
                    style="display: none">
                    <i class="fas fa-stop me-2"></i>Stop
                  </button>
                </div>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
