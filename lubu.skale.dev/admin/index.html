<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — lubu family</title>
    <style>
        body { background:#000; color:#fff; font-family:monospace; padding:3rem; line-height:2; }
        a { color:#fff; }
        .btn { display:inline-block; background:#fff; color:#000; padding:.4rem .9rem; text-decoration:none; border-radius:4px; margin:.2rem; border:none; font-family:monospace; font-size:.9rem; cursor:pointer; }
        .btn:hover { background:#ccc; }
        .btn.danger { background:#c0392b; color:#fff; }
        .btn.normie { background:#2c3e50; color:#fff; }
        .btn.admin { background:#27ae60; color:#fff; }
        table { border-collapse:collapse; width:100%; max-width:700px; }
        th, td { border:1px solid #333; padding:.5rem .8rem; text-align:left; }
        th { background:#111; }
        .role-admin { color:#27ae60; }
        .role-normie { color:#3498db; }
        .role-none { color:#e74c3c; }
        .attempts { max-width:700px; margin-top:2rem; }
        .attempts li { list-style:none; padding:.2rem 0; }
        .AuthSuccess { color:#27ae60; }
        .AuthFailure { color:#e74c3c; }
        .status { margin-bottom:1.5rem; }
    </style>
</head>
<body>
    <h1>Admin area</h1>
    <div id="status" class="status">Loading…</div>
    <h2>Users</h2>
    <table id="users">
        <thead><tr><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
        <tbody></tbody>
    </table>

    <h2 style="margin-top:2rem">Login attempts</h2>
    <ul id="attempts" class="attempts"></ul>

    <p style="margin-top:2rem"><a class="btn" href="/family/">← back to family</a></p>

<script>
let currentEmail = '';
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function roleClass(r){ return 'role-' + (r || 'none'); }

async function refresh(){
  const r = await fetch('/api/users');
  if(!r.ok){ document.getElementById('status').textContent = 'Not authorized (admin only).'; return; }
  const data = await r.json();
  document.getElementById('status').textContent = 'Logged in as ' + currentEmail;
  const tb = document.querySelector('#users tbody');
  tb.innerHTML = '';
  for(const [email, u] of Object.entries(data.users)){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(email) + '</td>'
      + '<td class="' + roleClass(u.role) + '">' + esc(u.role || 'banned') + '</td>'
      + '<td>'
      +   '<button class="btn admin" data-e="'+esc(email)+'" data-r="admin">admin</button>'
      +   '<button class="btn normie" data-e="'+esc(email)+'" data-r="normie">normie</button>'
      +   '<button class="btn danger" data-e="'+esc(email)+'" data-r="ban">ban</button>'
      + '</td>';
    tb.appendChild(tr);
  }
  const ul = document.getElementById('attempts');
  ul.innerHTML = '';
  for(const a of data.attempts.slice(0,20)){
    const li = document.createElement('li');
    li.innerHTML = '<span class="'+esc(a.status)+'">['+esc(a.status)+']</span> '
      + esc(a.time) + ' — ' + esc(a.email);
    ul.appendChild(li);
  }
}

async function act(email, role){
  if(role === 'ban'){
    if(!confirm('Ban ' + email + '?')) return;
    await fetch('/api/users/' + encodeURIComponent(email), {method:'DELETE'});
  } else {
    await fetch('/api/users/' + encodeURIComponent(email), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({role})
    });
  }
  refresh();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-e]');
  if(b) act(b.dataset.e, b.dataset.r);
});

// Get current logged-in email from /auth-status
fetch('/auth-status').then(r=>r.text()).then(e=>{ currentEmail=e.trim(); refresh(); });
</script>
</body>
</html>
