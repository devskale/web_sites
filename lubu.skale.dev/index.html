<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lubuntu</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: monospace;
            padding: 3rem;
            line-height: 2;
        }
        a { color: #fff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .login-btn {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: .6rem 1.4rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .login-btn:hover { background: #ccc; color: #000; text-decoration: none; }
        .status { margin-bottom: 1.5rem; }
        .status .email { color: #4caf50; }
        .logout { color: #888; margin-left: 1rem; font-size: .9rem; }
    </style>
</head>
<body>
    <div id="authbar" class="status">Checking login…</div>
    lubuntu<br>
    <a href="/jot/">jot</a> ·
    <a href="/searxng/">searxng</a> ·
    <a href="https://neusiedl.duckdns.org:8384">syncthing</a> ·
    <a href="/pinet/dashboard/">pinet ⚡</a> ·
    <a href="/firmenbuch/">firmenbuch 📋</a> ·
    <a href="/restaurants/">restaurants 🍽</a> ·
    <a href="https://neusiedl.duckdns.org:8003">paperclip 📎</a> ·
    <a href="/aiui/">aiui 🤖</a> ·
    <a href="/mdsites/">mdsites 📝</a> ·
    <a href="/throway/">throway 🗑</a>

<script>
fetch('/auth-status')
  .then(r => r.text())
  .then(email => {
    const bar = document.getElementById('authbar');
    if (email && email.trim()) {
      bar.innerHTML = 'Logged in as <span class="email">' + email.trim() + '</span>'
        + ' · <a href="/family/">family</a>'
        + ' · <a href="/admin/">admin</a>'
        + ' <a class="logout" href="/oauth2/sign_out?rd=https://lubu.skale.dev/">log out</a>';
    } else {
      bar.innerHTML = '<a class="login-btn" href="/family/">Login with Google</a>';
    }
  })
  .catch(() => {
    document.getElementById('authbar').innerHTML =
      '<a class="login-btn" href="/family/">Login with Google</a>';
  });
</script>
</body>
</html>
